; ChestPhysics.ini - letak dalam folder configs AML (sama tempat dengan fail .so mod ini)
enabled=1
; mode=classic atau flex (flex = lebih lembut dan lebih lama bergoyang)
mode=classic
; 1 = hanya ped perempuan (CIVFEMALE & PROSTITUTE)
female_only=1
; offset CPed::m_nPedType. 0x598 ialah nilai PC - MESTI disahkan untuk libGTASA v2.0
ped_type_offset=0x598

spring=120
damping=7
response_v=0.9
response_h=0.5
soft_limit=0.03
hard_limit=0.05
max_speed=1.2
soft_up=0.6
soft_down=1.0
